<svg viewBox="0 0 658 536" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A link turning about a fixed pivot O with a point P at its end. The normal component of P's acceleration points back along the link toward O and equals omega squared times r. The tangential component is perpendicular to the link and equals alpha times r. Their resultant is the acceleration of P.">
